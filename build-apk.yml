name: Bangun APK Kebun Murojaah

on:
  workflow_dispatch:
  push:
    paths:
      - '**/settings.gradle'
      - '**/MainActivity.java'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Cari folder proyek Android
        run: |
          echo "Isi repo:"; ls -la
          F=$(find . -name settings.gradle -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::File settings.gradle tidak ditemukan. Folder android belum terupload ke repo ini."
            exit 1
          fi
          D=$(dirname "$F")
          echo "Folder proyek: $D"
          echo "ADIR=$D" >> "$GITHUB_ENV"

      - name: Pasang Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bangun APK
        run: gradle -p "$ADIR" assembleRelease -PvCode=${{ github.run_number }} --no-daemon

      - name: Beri nama APK
        run: cp "$ADIR/app/build/outputs/apk/release/app-release.apk" KebunMurojaah.apk

      - name: Terbitkan sebagai rilis (link unduhan)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.${{ github.run_number }}
          name: Kebun Murojaah v8.${{ github.run_number }}
          body: Unduh KebunMurojaah.apk lalu pasang di HP Android.
          files: KebunMurojaah.apk
          make_latest: true
